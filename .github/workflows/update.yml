name: Update Happ

on:
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v30
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Update happ.nix and build
        id: update
        run: |
          output="$(scripts/update.sh)"
          echo "$output"
          if [[ "$output" == *"already up to date"* ]]; then
            echo "updated=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          version="$(sed -nE 's/.*version = "(.*)";/\1/p' happ.nix)"
          echo "updated=true" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Create pull request
        if: steps.update.outputs.updated == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          commit-message: "happ: update to ${{ steps.update.outputs.version }}"
          title: "happ: update to ${{ steps.update.outputs.version }}"
          body: |
            Automated update of Happ to `${{ steps.update.outputs.version }}`.

            Built with `nix build .#happ` inside the workflow.
            Review the `.deb` URL and hash change before merging.
          branch: happ-update
          delete-branch: true
